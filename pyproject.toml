[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asimov-conformance-prototype"
version = "0.2.0a2"
description = "Open safety standard and conformance tooling for autonomous AI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.scripts]
asimov-draft = "asimov_conformance.__main__:main"

[tool.setuptools.packages.find]
include = ["asimov_conformance*"]

[tool.setuptools.package-data]
asimov_conformance = ["catalog.json"]

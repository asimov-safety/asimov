<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Probe Explorer — Asimov</title><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Asimov</a><div class="links"><a href="contracts.html">Contracts</a><a href="profiles.html">A1–A5</a><a href="test.html">Test</a><a href="probes.html">Probes</a><a href="verification.html">Verification</a><a href="status.html">Status</a><a href="contribute.html">Contribute</a></div></div></nav><header class="hero"><div class="wrap"><div class="kicker">Conformance catalog</div><h1>42 testable families.</h1><p class="lede">Filter the current catalog by contract, assurance level, and implementation status.</p></div></header><section><div class="wrap"><div class="filters"><input id="q" placeholder="Search ID or title"><select id="level"><option value="">All levels</option><option>A1</option><option>A2</option><option>A3</option><option>A4</option><option>A5</option></select><select id="contract"><option value="">All contracts</option><option value="I">I · Observable Agency</option><option value="II">II · Mediated Action</option><option value="III">III · Revocable Authority</option><option value="IV">IV · Protected Oversight</option><option value="V">V · Bounded Delegation</option><option value="VI">VI · Human Authority</option><option value="VII">VII · Accountability</option></select></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Level</th><th>Title</th><th>Implementation</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><script>let catalog=[];const rows=document.getElementById('rows'),q=document.getElementById('q'),level=document.getElementById('level'),contract=document.getElementById('contract');function draw(){const needle=q.value.toLowerCase();rows.innerHTML=catalog.filter(r=>(!needle||(r.id+' '+r.title).toLowerCase().includes(needle))&&(!level.value||('A'+r.minimum_profile)===level.value)&&(!contract.value||r.contract===contract.value)).map(r=>'<tr><td><b>'+r.id+'</b></td><td>A'+r.minimum_profile+'</td><td>'+r.title+'</td><td>'+r.implementation_status.replaceAll('_',' ')+'</td></tr>').join('')}[q,level,contract].forEach(x=>x.addEventListener('input',draw));fetch('catalog.json').then(r=>r.json()).then(d=>{catalog=d.requirements;draw()});</script><footer><div class="wrap foot"><span>Asimov · Draft 0.2 · Apache-2.0</span><span><a href="https://github.com/asimov-safety/asimov">GitHub</a> · <a href="https://github.com/asimov-safety/asimov/blob/main/ASIMOV-CORE-0.2.md">Core specification</a></span></div></footer></body></html>
